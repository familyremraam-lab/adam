*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#150c2e;font-family:Fredoka,"Segoe UI",system-ui,Arial,sans-serif;color:#fff;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
/* ---- in-game buttons ---- */
.ibtn{position:fixed;width:50px;height:50px;border-radius:16px;border:3px solid #fff;background:linear-gradient(#a78bfa,#6d28d9);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.35);z-index:10;overflow:hidden}
.ibtn img{width:30px;height:30px;position:relative;pointer-events:none}
#gear{left:12px;top:12px}
#dashBtn{right:18px;bottom:22px;width:96px;height:96px;border-radius:50%;border:5px solid #fff;background:linear-gradient(#f472b6,#be185d);font-weight:700;font-size:21px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 7px 0 rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.35)}
#dashBtn img{width:40px;height:40px}
#dashBtn small{font-size:11px;opacity:.85;margin-top:2px}
#dashBtn.cd{filter:grayscale(.7) brightness(.8)}
#dashBtn .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.45) var(--p,0%),transparent 0);pointer-events:none}
.playing-off .ibtn{display:none!important}
#hint{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:rgba(20,8,48,.85);border:3px solid #fde047;border-radius:16px;padding:7px 16px;font-weight:700;font-size:clamp(15px,4vmin,20px);
  color:#fde047;pointer-events:none;text-align:center;z-index:9;animation:pulse 1.2s ease-in-out infinite;max-width:92vw}
#hint[hidden]{display:none}
#toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:rgba(20,8,48,.92);border:3px solid #fff;border-radius:16px;padding:8px 16px;font-weight:700;font-size:17px;z-index:60;pointer-events:none;
  opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:99;background:radial-gradient(120% 80% at 50% 0%,#7c3aed 0%,#4c1d95 45%,#1e0b3f 100%);font-size:28px;font-weight:700}
/* ---- popups ---- */
.ov{position:fixed;inset:0;background:rgba(10,4,26,.55);display:grid;place-items:center;z-index:50;padding:12px;animation:fadein .25s}
.ov.hide{display:none}
.card{width:min(94vw,460px);max-height:94vh;overflow:auto;touch-action:pan-y;overscroll-behavior:contain;background:linear-gradient(#8b5cf6,#5b21b6);border:5px solid #fff;border-radius:28px;padding:16px 16px 18px;text-align:center;
  box-shadow:0 14px 0 rgba(0,0,0,.35),inset 0 -6px 0 rgba(0,0,0,.2);animation:popin .3s cubic-bezier(.2,1.6,.4,1);scrollbar-width:none}
.card::-webkit-scrollbar{display:none}
.card h2{margin:0 0 4px;font-size:clamp(26px,7vmin,36px);text-shadow:0 3px 0 rgba(0,0,0,.3);line-height:1.05}
.card p{margin:6px 0;font-size:16px;opacity:.95}
.card>*{animation:slideup .35s cubic-bezier(.2,1.4,.4,1) both}
.card>*:nth-child(2){animation-delay:.05s}.card>*:nth-child(3){animation-delay:.1s}.card>*:nth-child(4){animation-delay:.15s}
.card>*:nth-child(5){animation-delay:.2s}.card>*:nth-child(n+6){animation-delay:.25s}
.card.still,.card.still>*{animation:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:4px solid #fff;border-radius:18px;padding:10px 20px;margin:8px 4px 0;font:700 20px Fredoka,system-ui,sans-serif;color:#fff;cursor:pointer;
  background:linear-gradient(#4ade80,#16a34a);box-shadow:0 6px 0 rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.3);position:relative;overflow:hidden;
  transition:transform .12s cubic-bezier(.3,1.8,.5,1),filter .15s}
.btn:active,.ibtn:active{transform:translateY(3px) scale(.93)}
.btn:hover,.ibtn:hover{filter:brightness(1.08)}
.btn::before,.ibtn::before{content:"";position:absolute;left:8%;right:8%;top:5px;height:32%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.08));pointer-events:none}
.btn>*{position:relative}
.btn.gold{background:linear-gradient(#fde047,#f59e0b);color:#3b2200;text-shadow:none}
.btn.blue{background:linear-gradient(#60a5fa,#1d4ed8)}
.btn.pink{background:linear-gradient(#f472b6,#be185d)}
.btn.gray{background:linear-gradient(#94a3b8,#475569)}
.btn.huge{font-size:30px;padding:12px 44px;border-radius:24px;border-width:5px;animation:playpulse 1.3s ease-in-out infinite}
.btn.small{font-size:15px;padding:6px 14px}
.btn[disabled]{filter:grayscale(1) brightness(.8);pointer-events:none}
.btn .ad{background:#1c1233;color:#fde047;border:2px solid #fff;border-radius:8px;padding:0 5px;font-size:11px;text-shadow:none}
.btn .coin,.coin{width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7cc 0 12%,#fde047 13% 45%,#f59e0b 46% 100%);border:2px solid #92400e;display:inline-block;flex:none;vertical-align:-.12em}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.logo{font-weight:700;font-size:clamp(40px,11vmin,58px);line-height:.9;letter-spacing:1px;color:#fde047;-webkit-text-stroke:3px #1c1233;paint-order:stroke fill;
  text-shadow:0 5px 0 rgba(0,0,0,.35);margin:2px 0 4px}
.logo i{font-style:normal;display:inline-block;background:#f472b6;color:#fff;-webkit-text-stroke:0;font-size:.42em;border:3px solid #fff;border-radius:12px;padding:2px 8px;vertical-align:.6em;transform:rotate(-8deg);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 6px}
.stats div{background:rgba(0,0,0,.25);border-radius:14px;padding:6px 2px;font-size:11px;font-weight:600;opacity:.95}
.stats b{display:block;font-size:21px;line-height:1.1}
.coinsgot{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border-radius:16px;padding:6px 16px;font-weight:700;font-size:24px;margin:4px 0}
.newtag{display:inline-block;background:#ef4444;border:3px solid #fff;border-radius:12px;padding:2px 12px;font-weight:700;font-size:18px;transform:rotate(-4deg);margin:2px 0 4px;animation:wob 1.6s ease-in-out infinite}
.killer{display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:700}
.killer img{width:54px;height:54px}
.prev{width:150px;height:150px;display:block;margin:0 auto;animation:bob 1.8s ease-in-out infinite}
.lvl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:8px 4px 2px}
.lvl .bar{flex:1;height:14px;background:rgba(0,0,0,.35);border-radius:8px;overflow:hidden;border:2px solid rgba(255,255,255,.25)}
.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,#fde047,#f59e0b)}
.quests{margin-top:8px;text-align:left}
.qrow{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.2);border-radius:14px;padding:7px 10px;margin:5px 0;font-size:14px;font-weight:600}
.qrow .qt{flex:1}.qrow .qb{height:8px;background:rgba(0,0,0,.35);border-radius:5px;overflow:hidden;margin-top:4px}.qrow .qb i{display:block;height:100%;background:#4ade80}
.qrow .qr{white-space:nowrap;font-weight:700}.qrow.done{opacity:.6}.qrow.done .qr{color:#4ade80}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.sk{background:rgba(0,0,0,.22);border-radius:16px;padding:4px 2px 6px;font-size:12px;font-weight:700;line-height:1.15;cursor:pointer;border:3px solid transparent;position:relative}
.sk img{width:100%;aspect-ratio:1;display:block}
.sk.on{border-color:#fde047;background:rgba(253,224,71,.2)}
.sk.lock img{filter:brightness(.8) saturate(.7)}
.sk .pr{display:flex;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#fde047}
.sk .pr.cant{color:#fca5a5}
.sk .eq{color:#4ade80}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.topbar .pillc{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);border-radius:999px;padding:4px 12px;font-weight:700;font-size:18px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.days div{background:rgba(0,0,0,.25);border-radius:10px;padding:5px 1px;font-size:10px;font-weight:700}
.days div b{display:block;font-size:12px;margin-top:2px}
.days .done{background:#16a34a}.days .now{background:linear-gradient(#fde047,#f59e0b);color:#3b2200;transform:scale(1.08)}
.srow{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.2);border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:700;font-size:18px}
.tgl{width:62px;height:34px;border-radius:999px;background:#475569;border:3px solid #fff;position:relative;cursor:pointer;transition:background .15s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on{background:#22c55e}.tgl.on::after{left:30px}
.dailybtn{position:relative}
.dailybtn .dot{position:absolute;right:-4px;top:-4px;width:16px;height:16px;border-radius:50%;background:#ef4444;border:2px solid #fff}
/* ---- button polish: countdown numbers, ready glow, rarity ring ---- */
#gear{border-radius:50%;width:52px;height:52px}
.ibtn .cdn{position:absolute;inset:0;display:grid;place-items:center;font:700 34px Fredoka,sans-serif;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;z-index:3;pointer-events:none}
.ibtn .cdn:empty{display:none}
.ibtn.cd img,.ibtn.cd>span,.ibtn.cd small{opacity:.35}
#dashBtn.ready,#abBtn.ready{animation:readyglow 1.4s ease-in-out infinite}
@keyframes readyglow{0%,100%{box-shadow:0 7px 0 rgba(0,0,0,.35),0 0 0 0 rgba(255,255,255,.0)}50%{box-shadow:0 7px 0 rgba(0,0,0,.35),0 0 18px 4px rgba(255,255,255,.55)}}
#abBtn{border-color:var(--rc,#fff);box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.7)}
#abBtn .abl{position:absolute;bottom:100%;margin-bottom:5px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 11px Fredoka,sans-serif;background:rgba(20,8,48,.8);border:2px solid var(--rc,#fff);border-radius:8px;padding:0 6px;pointer-events:none}
#abBtn{overflow:visible}
#abBtn .ring{overflow:hidden}
/* ---- ability button + crate ---- */
#abBtn{right:30px;bottom:136px;width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.35)}
#abBtn img{width:44px;height:44px}
#abBtn small{position:absolute;bottom:3px;font-size:11px;font-weight:700;text-shadow:0 1px 0 #000}
#abBtn.none{display:none}
#abBtn.cd{filter:grayscale(.7) brightness(.8)}
#abBtn .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.5) var(--p,0%),transparent 0);pointer-events:none}
@media (max-height:560px){ #abBtn{bottom:112px;width:64px;height:64px} #abBtn img{width:36px;height:36px} }
.st-abil{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.st-abil .pillc{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border-radius:999px;padding:4px 12px;font-weight:700;font-size:18px}
.abslot{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.4);border-radius:16px;padding:3px 12px 3px 6px;cursor:pointer;font-weight:700;font-size:14px;line-height:1.05;text-align:left}
.abslot img{width:36px;height:36px}.abslot small{display:block;font-size:11px;color:#fde047}
.cratebtn{margin:0!important;position:relative}.cratebtn .dot{position:absolute;right:-5px;top:-5px;width:16px;height:16px;border-radius:50%;background:#ef4444;border:2px solid #fff}
.rarrow{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:4px 0}
.rarrow span{border:2px solid #fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700}
.rollwin{position:relative;overflow:hidden;height:112px;border:4px solid #fff;border-radius:18px;background:rgba(0,0,0,.4);margin:12px 0}
.rollwin::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#fde047;box-shadow:0 0 10px #fde047}
.rollstrip{position:absolute;left:50%;top:8px;display:flex;gap:10px;transition:transform 3.2s cubic-bezier(.12,.75,.18,1)}
.ritem{width:88px;height:88px;flex:none;border:4px solid;border-radius:16px;display:grid;place-items:center}
.ritem img{width:64px;height:64px}
/* ---- inventory (like Party Pads: tabs + rarity cards) ---- */
.invtabs{display:flex;gap:8px;margin:6px 0 8px}
.invtab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:4px solid rgba(255,255,255,.4);border-radius:16px;padding:6px;font-weight:700;font-size:18px;cursor:pointer;
  background:rgba(0,0,0,.3);opacity:.75;transition:transform .12s cubic-bezier(.3,1.8,.5,1)}
.invtab img{width:30px;height:30px}
.invtab.on{opacity:1;border-color:#fff;background:linear-gradient(#fde047,#f59e0b);color:#3b2200;transform:scale(1.04);box-shadow:0 5px 0 rgba(0,0,0,.3)}
.invhero{display:flex;align-items:center;gap:10px;border:4px solid rgba(255,255,255,.5);border-radius:20px;padding:8px 12px;text-align:left;margin-bottom:8px}
.invhero img{width:110px;height:110px;flex:none;animation:bob 1.8s ease-in-out infinite}
.invhero b{display:block;font-size:24px;line-height:1.05;margin:3px 0}
.invhero small{display:block;font-size:13px;opacity:.95;margin-bottom:2px}
.invhero .btn{margin:4px 0 0}
.rtag{display:inline-block;border:2px solid #fff;border-radius:10px;padding:0 8px;font-size:11px;font-weight:700}
.invgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 8px}
.icard{position:relative;border:3px solid;border-radius:16px;padding:4px 2px 12px;font-size:12px;font-weight:700;line-height:1.1;cursor:pointer;overflow:hidden;transition:transform .12s cubic-bezier(.3,1.8,.5,1)}
.icard img{width:100%;aspect-ratio:1;display:block;box-sizing:border-box}
.icard>span{display:block}
.icard i.pr{display:flex;align-items:center;justify-content:center;gap:3px}
.icard .coin{display:inline-block;width:1em;height:1em}
.icard i{display:block;font-style:normal;font-size:11px}
.icard i.pr{color:#fde047}.icard i.pr.cant{color:#fca5a5}.icard i.eq{color:#4ade80}
.icard u{position:absolute;left:0;right:0;bottom:0;height:6px}
.icard.lock img{filter:brightness(.75) saturate(.6)}
.icard.sel{transform:scale(1.06);box-shadow:0 0 0 3px #fff}
.icard.on{box-shadow:0 0 14px rgba(253,224,71,.8)}
/* ---- crate shop ---- */
.crtile{display:flex;align-items:center;gap:8px;border:4px solid;border-radius:20px;padding:8px 10px;margin:8px 0;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.3);position:relative;overflow:hidden}
.crtile::before{content:"";position:absolute;left:-30%;top:0;width:30%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:shine 3.2s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,60%{left:-30%}100%{left:130%}}
.crimg{width:84px;height:84px;flex:none;animation:bob 1.8s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.crmid{flex:1;min-width:0}.crmid b{font-size:18px;display:block;margin-bottom:4px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.crabs{display:flex;gap:4px;flex-wrap:wrap}
.crab{position:relative;width:44px;height:44px;border:3px solid;border-radius:12px;background:rgba(0,0,0,.3);display:grid;place-items:center}
.crab img{width:32px;height:32px}
.crab i{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9px;font-weight:700;border-radius:6px;padding:0 3px;border:1px solid #fff;white-space:nowrap}
.crtile .btn{margin:0;flex:none;padding:8px 12px}
.crshake{animation:crshake .16s linear infinite!important}
@keyframes crshake{0%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.06)}100%{transform:rotate(-6deg) scale(1)}}
.crflash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70}
.crflash.on{animation:crflash .5s ease-out}
@keyframes crflash{from{opacity:.95}to{opacity:0}}
/* ---- start screen ---- */
#start{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;gap:34px;padding:14px;overflow:auto;touch-action:pan-y;
  background:radial-gradient(ellipse at 50% 40%,rgba(30,12,70,.55),rgba(8,3,22,.9) 75%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#start.hide{display:none}
.st-main{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:460px;width:100%}
.st-side{width:100%;max-width:380px;background:linear-gradient(rgba(91,33,182,.85),rgba(46,16,101,.9));border:4px solid #fff;border-radius:24px;padding:12px 14px;box-shadow:0 10px 0 rgba(0,0,0,.3)}
.st-logo{font-size:clamp(38px,min(12vmin,10vw),92px)!important;white-space:nowrap;animation:logofloat 2.4s ease-in-out infinite;margin:0!important}
@keyframes logofloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.st-tag{background:linear-gradient(#f472b6,#be185d);border:3px solid #fff;border-radius:999px;padding:3px 16px;font-weight:700;font-size:15px;transform:rotate(-2deg);margin-top:-4px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.st-skin{display:flex;align-items:center;gap:6px}
.arrow{position:relative;z-index:3;width:52px;height:52px;border-radius:50%;border:4px solid #fff;background:linear-gradient(#a78bfa,#6d28d9);color:#fff;font:700 26px Fredoka,sans-serif;display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35);
  transition:transform .12s cubic-bezier(.3,1.8,.5,1)}
.arrow:active{transform:scale(.88)}
.st-skin .prevwrap,.st-skin .prevwrap .prev{width:clamp(120px,24vmin,190px);height:clamp(120px,24vmin,190px)}
.st-name{background:rgba(0,0,0,.35);border-radius:999px;padding:2px 14px;font-weight:700;font-size:17px}
.diffs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:4px 0}
.dif{border:3px solid rgba(255,255,255,.5);border-radius:14px;padding:5px 10px 4px;font:700 15px Fredoka,sans-serif;color:#fff;cursor:pointer;opacity:.75;line-height:1.05;text-align:center;
  box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
.dif small{display:block;font-size:10.5px;opacity:.95}
.dif.on{opacity:1;border-color:#fff;transform:scale(1.12);box-shadow:0 0 0 3px rgba(255,255,255,.35),0 5px 0 rgba(0,0,0,.35)}
.dif.lock{filter:grayscale(.8);opacity:.5}
.dif.demon.on{animation:demon 0.9s ease-in-out infinite}
@keyframes demon{50%{box-shadow:0 0 18px 4px rgba(239,68,68,.9),0 5px 0 rgba(0,0,0,.35)}}
@media (min-aspect-ratio:5/4) and (min-width:760px){ #start{flex-direction:row} .st-side{max-height:90vh;overflow:auto} }
@media (max-aspect-ratio:5/4),(max-width:759px){ #start{flex-direction:column;justify-content:flex-start} .st-side{margin-bottom:10px} }
/* ---- rich menus ---- */
.ov{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);background:radial-gradient(circle at 20% 30%,rgba(244,114,182,.18) 0 60px,transparent 61px),radial-gradient(circle at 85% 70%,rgba(96,165,250,.18) 0 90px,transparent 91px),radial-gradient(circle at 75% 15%,rgba(253,224,71,.14) 0 40px,transparent 41px),rgba(10,4,26,.55)}
.card{background:radial-gradient(120% 60% at 50% 0%,#a78bfa 0%,#7c3aed 38%,#5b21b6 75%,#4c1d95 100%);position:relative}
.card::after{content:"";position:absolute;inset:0;border-radius:23px;pointer-events:none;background:radial-gradient(circle at 12% 8%,rgba(255,255,255,.25) 0 3px,transparent 4px),radial-gradient(circle at 88% 14%,rgba(255,255,255,.25) 0 4px,transparent 5px),radial-gradient(circle at 92% 55%,rgba(255,255,255,.18) 0 3px,transparent 4px),radial-gradient(circle at 6% 60%,rgba(255,255,255,.18) 0 4px,transparent 5px)}
.prevwrap{position:relative;width:170px;height:170px;margin:0 auto}
.prevwrap::before{content:"";pointer-events:none;position:absolute;inset:-34px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.22) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);animation:spinr 14s linear infinite;will-change:transform}
.prevwrap::after{content:"";pointer-events:none;position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle,rgba(253,224,71,.45),transparent 70%)}
.prevwrap .prev{position:relative;z-index:1;width:170px;height:170px}
@keyframes spinr{to{transform:rotate(360deg)}}
.ribh{display:inline-block;background:linear-gradient(#f472b6,#be185d);border:4px solid #fff;border-radius:18px;padding:4px 18px;transform:rotate(-2deg);box-shadow:0 5px 0 rgba(0,0,0,.3);margin:0 0 8px}
.ribh h2{margin:0;font-size:clamp(22px,6vmin,30px)}
.stats div{position:relative;border:3px solid rgba(255,255,255,.5);box-shadow:0 4px 0 rgba(0,0,0,.25);padding:4px 2px 6px}
.stats div:nth-child(1){background:linear-gradient(#fde047,#f59e0b);color:#3b2200}.stats div:nth-child(2){background:linear-gradient(#f9a8d4,#db2777)}
.stats div:nth-child(3){background:linear-gradient(#86efac,#16a34a)}.stats div:nth-child(4){background:linear-gradient(#93c5fd,#2563eb)}
.stats img{width:28px;height:28px;display:block;margin:0 auto -2px}
.btn .bi{width:1.25em;height:1.25em;flex:none}
.btn .tri{width:0;height:0;border-left:.62em solid currentColor;border-top:.4em solid transparent;border-bottom:.4em solid transparent;margin-right:2px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.coinsgot{border:3px solid rgba(253,224,71,.7);background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.2));box-shadow:0 0 18px rgba(253,224,71,.35)}
.coinsgot .coin{width:1.1em;height:1.1em;animation:coinspin 1.4s ease-in-out infinite}
@keyframes coinspin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
.qrow{border:2px solid rgba(255,255,255,.12)}
.lvl span:first-child{background:linear-gradient(#fde047,#f59e0b);color:#3b2200;border:2px solid #fff;border-radius:10px;padding:1px 8px}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideup{from{transform:translateY(14px);opacity:0}}
@keyframes fadein{from{background:rgba(10,4,26,0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
@keyframes playpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.05)}}
@media (max-height:560px){ .prev,.prevwrap,.prevwrap .prev{width:96px;height:96px} .card{padding:10px 14px 12px} .btn.huge{font-size:24px;padding:8px 34px} #dashBtn{width:80px;height:80px} }
/* ================= UPDATE 2 ================= */
#shootBtn{bottom:30px;width:68px;height:68px;border-radius:50%;border:4px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 12px Fredoka,sans-serif;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4);line-height:1}
#shootBtn{right:128px;background:linear-gradient(#fbbf24,#d97706)}
#shootBtn img{width:34px;height:34px}
#shootBtn small{font-size:10px;opacity:.85}
@media (max-height:560px){ #shootBtn{width:58px;height:58px;bottom:20px;right:108px} #shootBtn img{width:28px;height:28px} }
.modes{display:flex;gap:6px;justify-content:center;margin:4px 0 0;width:100%;max-width:440px}
.mode{flex:1;border:3px solid rgba(255,255,255,.5);border-radius:16px;padding:6px 6px 5px;cursor:pointer;opacity:.72;text-align:center;line-height:1.05;transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
.mode b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:17px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.mode b i{font-style:normal;font-size:9px;background:#fde047;color:#3b2200;border-radius:6px;padding:1px 4px;text-shadow:none}
.mode small{display:block;font-size:10.5px;opacity:.95;margin-top:2px}
.mode.on{opacity:1;border-color:#fff;transform:scale(1.06);box-shadow:0 0 0 3px rgba(255,255,255,.35),0 5px 0 rgba(0,0,0,.35)}
.moderes{display:inline-block;margin:6px auto 0;background:#7c3aed;border:2px solid #fff;border-radius:12px;padding:4px 12px;font-weight:700;font-size:14px}
.invtabs.five{gap:4px;flex-wrap:nowrap}
.invtabs.five .invtab{flex:1 1 0;min-width:0;font-size:12px;padding:5px 2px;gap:2px;flex-direction:column;border-width:3px;letter-spacing:-.3px}
@media (max-width:420px){ .invtabs.five .invtab{font-size:10px} .invtabs.five .invtab img{width:24px!important;height:24px!important} }
.invtabs.five .invtab img{width:30px;height:30px}
.invhero small{display:block;font-size:13px;opacity:.9;margin:2px 0 4px}
/* ================= QUALITY PASS: controls overlay, big text, confetti, nicer popups ================= */
#ctlHelp{position:fixed;left:50%;bottom:24%;transform:translateX(-50%);z-index:45;background:linear-gradient(rgba(30,12,70,.88),rgba(15,6,40,.88));border:4px solid #fff;border-radius:22px;padding:10px 16px;box-shadow:0 0 0 4px #1c1233,0 10px 0 4px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:8px;animation:ctlin .45s cubic-bezier(.2,1.5,.4,1) both;pointer-events:auto}
#ctlHelp.out{animation:ctlout .35s ease-in forwards}
@keyframes ctlin{from{transform:translateX(-50%) scale(.4);opacity:0}}@keyframes ctlout{to{transform:translateX(-50%) translateY(30px);opacity:0}}
#ctlHelp .crow{display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap}#ctlHelp .crow b{color:#fde047;font-size:17px;margin-left:4px}
#ctlHelp .or{opacity:.7;font-size:13px;margin:0 2px}
.kc{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:9px;background:linear-gradient(#fff,#cbd5e1);color:#1c1233;font-weight:700;font-size:15px;box-shadow:0 4px 0 #64748b,0 0 0 2px #1c1233;animation:kcpress 1.6s ease-in-out infinite}
.kc.wide{min-width:78px;font-size:13px}.kc.round{border-radius:50%;width:48px;height:48px;background:linear-gradient(#f472b6,#be185d);color:#fff;font-size:11px}
.kc:nth-child(2){animation-delay:.2s}.kc:nth-child(3){animation-delay:.4s}.kc:nth-child(4){animation-delay:.6s}
@keyframes kcpress{0%,70%,100%{transform:translateY(0);box-shadow:0 4px 0 #64748b,0 0 0 2px #1c1233}80%{transform:translateY(3px);box-shadow:0 1px 0 #64748b,0 0 0 2px #1c1233}}
.mouse{width:26px;height:38px;border:3px solid #fff;border-radius:13px;position:relative;display:inline-block;box-shadow:0 0 0 2px #1c1233}
.mouse i{position:absolute;left:50%;top:6px;width:3px;height:8px;margin-left:-1.5px;background:#fde047;border-radius:2px;animation:wheel 1.2s ease-in-out infinite}
@keyframes wheel{50%{transform:translateY(6px);opacity:.4}}
.finger{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid #fff;position:relative;display:inline-block;animation:drag 1.6s ease-in-out infinite}
.finger i{position:absolute;inset:9px;border-radius:50%;background:#fde047}@keyframes drag{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
.bigtxt{position:fixed;left:50%;top:38%;z-index:46;pointer-events:none;font-weight:700;color:#fde047;-webkit-text-stroke:4px #1c1233;paint-order:stroke fill;text-shadow:0 8px 0 #1c1233,0 14px 30px rgba(0,0,0,.5);white-space:nowrap;animation:bigin .9s cubic-bezier(.2,1.5,.4,1) forwards}
.bigtxt.go{font-size:clamp(70px,20vmin,150px);color:#4ade80}.bigtxt.logo{font-size:clamp(46px,13vmin,110px);animation:bigin 1.9s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes bigin{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15) rotate(-3deg);opacity:1}35%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}75%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}100%{transform:translate(-50%,-80%) scale(.8) rotate(-3deg);opacity:0}}
.cft{position:fixed;top:-20px;width:10px;height:16px;z-index:60;pointer-events:none;border-radius:3px;animation:cftfall 2.4s linear forwards}
@keyframes cftfall{to{transform:translate(var(--dx),108vh) rotate(720deg)}}
.ov{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow:hidden}
.card{position:relative;background:radial-gradient(120% 55% at 50% 0%,rgba(255,255,255,.26),rgba(255,255,255,0) 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 14px,rgba(255,255,255,0) 14px 28px),linear-gradient(#8b5cf6,#5b21b6)!important;box-shadow:0 0 0 4px #1c1233,0 14px 0 4px rgba(0,0,0,.35),inset 0 -7px 0 rgba(0,0,0,.2),inset 0 4px 0 rgba(255,255,255,.25),0 30px 70px rgba(0,0,0,.55)!important}
.card.red{background:radial-gradient(120% 55% at 50% 0%,rgba(255,255,255,.26),rgba(255,255,255,0) 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 14px,rgba(255,255,255,0) 14px 28px),linear-gradient(#fb7185,#9f1239)!important}
.card.gold{background:radial-gradient(120% 55% at 50% 0%,rgba(255,255,255,.34),rgba(255,255,255,0) 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 14px,rgba(255,255,255,0) 14px 28px),linear-gradient(#fbbf24,#c2410c)!important}
.card h2,.ribh h2{paint-order:stroke fill;-webkit-text-stroke:5px #1c1233;text-shadow:0 4px 0 #1c1233}
.card .btn{box-shadow:0 0 0 3px #1c1233,0 6px 0 3px rgba(0,0,0,.35)}
.xbtn{position:sticky;top:0;float:right;z-index:5;width:40px;height:40px;margin:-8px -8px -32px 0;border-radius:50%;background:linear-gradient(#f87171,#b91c1c);border:3px solid #fff;box-shadow:0 0 0 3px #1c1233,0 4px 0 3px rgba(0,0,0,.3);display:grid;place-items:center;font-weight:700;font-size:20px;cursor:pointer;color:#fff;transition:transform .12s}
.xbtn:hover{transform:scale(1.1) rotate(90deg)}
.ov.rays::before{content:"";position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;pointer-events:none;background:repeating-conic-gradient(rgba(253,224,71,.15) 0 10deg,rgba(253,224,71,0) 10deg 24deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 55%);mask:radial-gradient(circle,#000 10%,transparent 55%);animation:spinrays 24s linear infinite}
@keyframes spinrays{to{transform:rotate(360deg)}}
.qrow,.srow,.crtile,.invhero{box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 3px 0 rgba(0,0,0,.15)}
/* ================= PARTY-PADS-STYLE START SCREEN ================= */
#start{background:var(--bpwall,none) 0 0/160px 160px repeat,radial-gradient(ellipse at 50% 32%,#8b5cf6 0%,#5b21b6 40%,#1e0b3f 100%)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#start::before{content:"";position:fixed;left:50%;top:34%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;will-change:transform;z-index:-1;pointer-events:none;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 9deg,rgba(255,255,255,0) 9deg 22deg);animation:spinrays 60s linear infinite}
.btn.bigplay{flex-direction:column;gap:0;padding:0;overflow:hidden;width:min(94%,420px);border-radius:26px;background:linear-gradient(#fdba74,#f97316 55%,#ea580c)!important;color:#fff;box-shadow:0 0 0 4px #1c1233,0 9px 0 4px rgba(0,0,0,.35),0 0 30px rgba(251,146,60,.45)!important}
.btn.bigplay .bp-top{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 0 10px;font-size:clamp(34px,6vmin,46px);-webkit-text-stroke:3px #1c1233;paint-order:stroke fill;text-shadow:0 4px 0 #1c1233}
.btn.bigplay .bp-sub{display:block;width:100%;padding:5px 0 6px;background:linear-gradient(#3b82f6,#1d4ed8);border-top:3px solid #fff;font-size:14px;letter-spacing:1.5px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.stc{position:fixed;top:12px;z-index:3;display:inline-flex;align-items:center;gap:6px;background:linear-gradient(rgba(30,12,70,.85),rgba(15,6,40,.85));border:3px solid #fde047;border-radius:999px;padding:4px 14px;font-weight:700;font-size:16px;box-shadow:0 0 0 3px #1c1233}
.stc.left{left:14px}.stc.right{right:14px}.stc .coin{width:1.1em;height:1.1em}
@media (max-aspect-ratio:5/4),(max-width:759px){ #start{padding-top:58px!important} .stc{position:absolute;top:10px} }
.st-side{box-shadow:0 0 0 4px #1c1233,0 10px 0 4px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.2),0 0 40px rgba(167,139,250,.35)!important;background:linear-gradient(#7c3aed,#5b21b6 55%,#3b0f8a)!important}
</style>

/* the jelly outline: a wobbly circle that stretches the way it moves */
function blobPath(b,r,t){
  const n=32, pts=[], sp=Math.min(1,Math.hypot(b.vx||0,b.vy||0)/260), ang=Math.atan2(b.vy||0,b.vx||0), sq=b.squish||0, sd=b.seed||1;

    const al=Math.cos(a-ang); k*=1+.06*sp*al*al-.025*sp;
    pts.push([Math.cos(a)*r*k,Math.sin(a)*r*k]); }
  const p=new Path2D(), L=pts[n-1];
  p.moveTo((L[0]+pts[0][0])/2,(L[1]+pts[0][1])/2);
  for(let i=0;i<n;i++){ const a=pts[i], c=pts[(i+1)%n]; p.quadraticCurveTo(a[0],a[1],(a[0]+c[0])/2,(a[1]+c[1])/2); }
  p.closePath(); return p;
}

function stk(g,fill,lw,stroke){ g.fillStyle=fill; g.fill(); g.lineWidth=lw; g.strokeStyle=stroke||INK; g.stroke(); }

let AC=null, MST=null, MUSG=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); MST=AC.createGain(); MST.connect(AC.destination); MUSG=AC.createGain(); MUSG.connect(MST); }catch(_){} }
  if(AC&&AC.state==='suspended') AC.resume(); applyVol(); return AC; }
function applyVol(){ if(!MST) return; const on=!CG.muted&&!CG.adBusy&&!document.hidden; MST.gain.value=on?.4:0; if(MUSG) MUSG.gain.value=S.mus?.35:0; }
function tone(f,d,type,v,slide,delay){ if(!AC||!S.sfx||CG.muted) return; const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(), gg=AC.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t0+d);
  gg.gain.setValueAtTime(0,t0); gg.gain.linearRampToValueAtTime(v||.3,t0+.008); gg.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(gg); gg.connect(MST); o.start(t0); o.stop(t0+d+.02); }

/* music: bouncy loop, scheduled a little ahead */
const MUS={on:false,next:0,step:0,timer:null};
const BASS=[48,48,55,55,53,53,50,55], MEL=[72,0,76,79,0,76,72,0, 74,0,77,81,0,77,74,0, 72,76,79,84,0,79,76,72, 71,0,74,79,0,77,74,71];
const mf=n=>440*Math.pow(2,(n-69)/12);
function musTick(){ if(!AC||!MUSG) return; const spb=60/118/2;
  while(MUS.next<AC.currentTime+.2){ const t=MUS.next, st=MUS.step;
    const note=(f,d,type,v)=>{ const o=AC.createOscillator(), gg=AC.createGain(); o.type=type; o.frequency.value=f; gg.gain.setValueAtTime(0,t); gg.gain.linearRampToValueAtTime(v,t+.01); gg.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(gg); gg.connect(MUSG); o.start(t); o.stop(t+d+.02); };
    if(st%2===0) note(mf(BASS[(st>>2)%8]-12),spb*1.6,'triangle',.5);
    const m=MEL[st%32]; if(m) note(mf(m),spb*.9,'square',.07);
    if(st%4===2){ note(2400,.03,'square',.03); }
    MUS.next+=spb; MUS.step++; } }
function musStart(){ if(MUS.timer||!ac()) return; MUS.next=AC.currentTime+.1; MUS.timer=setInterval(musTick,50); }

const rad=m=>m<=5000?6*Math.sqrt(m):424.3*(1+.17*Math.log(Math.min(m,MAXM)/5000));   /* size stops growing at 1M mass - mass itself is unlimited */

function freeSpot(minD,edge){ const e=edge||150; for(let k=0;k<30;k++){ const x=rnd(e,WORLD-e), y=rnd(e,WORLD-e);

function makeBlob(isP){ const [x,y]=freeSpot(400,isP?600:150);                /* the player never starts at a wall */
  const b={id:uid++,x,y,vx:0,vy:0,m:20,r:rad(20),dr:rad(20),alive:true,isP:!!isP,seed:Math.random()*10,lx:0,ly:0,blink:0,blinkT:rnd(1,4),mood:0,squish:0,eatT:0,
    shield:0,dashT:0,dashCd:0,spikeCd:0,pw:{spd:0,mag:0,x2:0},kills:0,dx:1,dy:0,thr:0};

  else { b.name=pickName(); b.skin=(Math.random()*SKINS.length)|0; const k=Math.random();
    b.m=k<.45?rnd(14,45):k<.8?rnd(45,200):k<.94?rnd(200,650):rnd(650,1600); b.m*=D().big; b.r=b.dr=rad(b.m);
    b.bot={t:0,aggr:rnd(.5,1.1)*D().aggr,thr:rnd(.86,.98)*D().thr,tx:x,ty:y,mode:'food',target:null}; }

    if(by===P){ if(b.boss) qAdd('boss',1); qMax('eatbig',b.m); if(P.dashT>0) qAdd('dashkill',1);
      R0.kt=(R0.kt||[]).filter(t=>T-t<6); R0.kt.push(T); qMax('combo',R0.kt.length); }
    if(by===P){ R0.kills++; qAdd('kills',1); SFX.gulp(); shake=Math.max(shake,6); floatTxt(b.x,b.y,'+'+Math.floor(b.m),'#fde047',true);
      addFeed('You ate '+b.name+'!'); if(R0.kills%3===0) floatTxt(P.x,P.y-P.r-30,['MEGA GULP!','UNSTOPPABLE!','BLOB BOSS!'][Math.min(2,R0.kills/3-1)],'#f472b6',true); }

    else if(!by.isP&&T-LASTGF>.6&&Math.abs(b.x-CAM.x)<W/CAM.z*.6&&Math.abs(b.y-CAM.y)<H/CAM.z*.6&&(LASTGF=T)) floatTxt(b.x,b.y,"GULP!","#f9a8d4");   /* bots fighting bots, on screen */ }
    if(by&&!by.isP&&b!==P&&T-LASTBF>3){ LASTBF=T; addFeed(by.name+" ate "+b.name+"!"); }       /* the kill feed: bots fight all over the map */
  if(b===P){ R0.deadM=P.m; killer=by||null; STATE="dying"; $("hint").hidden=true; document.body.classList.add("playing-off"); HINTSTEP=Math.max(HINTSTEP,9); IN.joy=null; deadT=0; SFX.die(); shake=14; }
  else setTimeout(()=>{ if(S.mode!=='royale'&&blobs.filter(x=>!x.isP).length<D().bots) blobs.push(makeBlob(false)); },rnd(1500,4000));
}
function endRound(){
  const base=Math.round((Math.floor(3*Math.sqrt(R0.maxM))+R0.kills*5+(R0.top1?30:0)+(R0.boss||0)*60)*D().coin)+(R0.bonus||0);   /* coins grow slowly with mass (user: coins were too easy) */
  const paid=R0.paid||0; R0.coins=Math.max(5,base-paid); R0.paid=paid+R0.coins; S.coins+=R0.coins; qAdd('coins',R0.coins);   /* after a revive, only pay for the new part */

  if(R0.maxM>S.best){ R0.newBest=S.best>0; S.best=Math.floor(R0.maxM); if(R0.newBest){ try{ CG.ok&&CG.S.game.happytime(); }catch(_){} } }

/* ---------- bots ---------- */
function botThink(b){
  const B=b.bot, r=b.r, range=D().range+r*1.5;
  let fx=0, fy=0, best=null, bestS=0, danger=0;
  const pShy=P&&P.alive?(D().shy?Math.min(1,R0.t/D().shy):1):1;          /* go easy on the player at the start of a round */
  for(const o of blobs){ if(o===b||!o.alive||o.ghost>0||(b.team!==undefined&&o.team===b.team)) continue; const dx=o.x-b.x, dy=o.y-b.y, d=Math.hypot(dx,dy), gap=d-o.r-r; if(gap>range) continue;
    if(o.m>b.m*1.18&&!(b.shield>0)){ const w=Math.max(0,(range-gap)/range); fx-=dx/(d||1)*w*w*3; fy-=dy/(d||1)*w*w*3; danger=Math.max(danger,w); }
    else if(b.m>o.m*1.21&&!(o.shield>0)){ let sc=o.m/(gap+80); if(o.isP) sc*=pShy*D().focus*(b.boss?8:1); if(sc>bestS){ bestS=sc; best=o; } } }
  for(const s of spikes){ if(r<s.r*1.1) continue; const dx=s.x-b.x, dy=s.y-b.y, d=Math.hypot(dx,dy); if(d<r+s.r+120){ fx-=dx/d*1.5; fy-=dy/d*1.5; } }
  const edge=250; if(b.x<edge) fx+=(edge-b.x)/edge*2; if(b.x>WORLD-edge) fx-=(b.x-WORLD+edge)/edge*2; if(b.y<edge) fy+=(edge-b.y)/edge*2; if(b.y>WORLD-edge) fy-=(b.y-WORLD+edge)/edge*2;
  b.mood=danger>.35?1:0;
  if(danger>.22){ B.mode='flee'; const L=Math.hypot(fx,fy)||1; b.dx=fx/L; b.dy=fy/L; b.thr=1; if(danger>.7&&b.dashCd<=0&&Math.random()<.3*B.aggr){ b.dashT=.3; b.dashCd=3; } return; }
  /* commit to a hunt: keep chasing the same target for a few seconds instead of changing its mind */
  const lk=B.lock; if(lk&&B.lockT>T&&lk.alive&&!(lk.shield>0)&&!(lk.ghost>0)&&b.m>lk.m*1.21&&Math.hypot(lk.x-b.x,lk.y-b.y)<range*1.6+r+lk.r) best=lk; else B.lock=null;
  if(best&&(best===B.lock||b.boss||Math.random()<B.aggr+D().chase+(best.isP?0:.6))){ if(best!==B.lock){ B.lock=best; B.lockT=T+(best.isP?rnd(2,3.3):rnd(2.5,4)); } B.mode="chase"; B.tgtP=best.isP; const lead=.35; const tx=best.x+best.vx*lead, ty=best.y+best.vy*lead; let dx=tx-b.x+fx*60, dy=ty-b.y+fy*60; const L=Math.hypot(dx,dy)||1;

    CG.adBusy=true; applyVol(); let done=false, started=false;
    const fin=()=>{ if(done) return; done=true; CG.adBusy=false; LASTAD=Date.now(); applyVol(); go(); };

const QREW=[40,70,110];
let QCHK=0;
function quests(){ const now=Date.now(); if(S.quests&&now-QCHK<5000) return S.quests; QCHK=now; const d=DAYKEY(new Date());
  if(!S.quests||S.quests.day!==d||!S.quests.list.every(x=>QPOOL.some(p=>p.k===x.k))) S.quests=makeQuests(d,0);
  return S.quests; }
function makeQuests(d,extra){ const ok=QPOOL.filter(p=>(!p.lv||S.lv>=p.lv)&&(p.k!=='abil'||S.abEq)&&(p.k!=='split'||S.abEq==='split')&&(p.k!=='spikeshot'||S.abEq==='shoot')), pool=ok.slice().sort(()=>Math.random()-.5).slice(0,3), lvl=Math.floor((S.lv-1)/4)+extra;
  return {day:d,extra,list:pool.map((p,i)=>{ const want=lvl+(i===2?1:0), tier=Math.min(2,want), over=Math.max(0,want-2), grow=1+.5*over;
    return {k:p.k,n:p.rank?p.n[tier]:Math.min(p.cap||1e9,Math.round(p.n[tier]*grow)),tier,rew:Math.round(QREW[tier]*grow),p:0,done:0}; })}; }
function qDone(x){ x.done=1; const r=x.rew||QREW[x.tier]; S.coins+=r; const up=addXP(r), gm=2+x.tier; addGems(gm); SFX.quest();
  toast(up?'Quest done! LEVEL UP! You are LV '+S.lv:'Quest done! +'+r+' coins & +'+gm+' gems');
  const q=S.quests; if(q.list.every(y=>y.done)){                                   /* all 3 done: bonus + a fresh, harder set */
    S.coins+=100; addXP(100); addGems(5); S.quests=makeQuests(q.day,(q.extra||0)+1); QCHK=Date.now();
    setTimeout(()=>{ toast('ALL 3 DONE! +100 coins +5 gems - 3 NEW quests!'); SFX.top(); },1600); }
  save(); }
function qAdd(k,n){ for(const x of quests().list) if(x.k===k&&!x.done){ x.p+=n; if(x.p>=x.n) qDone(x); } }
function qMax(k,v){ for(const x of quests().list) if(x.k===k&&!x.done){ x.p=Math.max(x.p,Math.floor(v)); if(x.p>=x.n) qDone(x); } }
function qTop(rank){ for(const x of quests().list) if(x.k==='top'&&!x.done&&rank<=x.n) qDone(x); }
function qTime(t){ qMax('time',t); if(P) qMax('mass',P.m); }

const _drawIcon=drawIcon;
drawIcon=function(g,k,s){
  const lw=s*.07; g.lineJoin='round'; g.lineCap='round';
  const out=(fill)=>{ g.lineWidth=lw*3.2; g.strokeStyle='#fff'; g.stroke(); g.lineWidth=lw*1.6; g.strokeStyle=INK; g.stroke(); g.fillStyle=fill; g.fill(); };
  const grad=(a,b)=>{ const gr=g.createLinearGradient(0,0,0,s); gr.addColorStop(0,a); gr.addColorStop(1,b); return gr; };
  if(k==='snow'){ g.save(); g.translate(s/2,s/2); for(const [w,c] of [[s*.16,'#fff'],[s*.1,INK],[s*.06,'#7dd3fc']]){ g.strokeStyle=c; g.lineWidth=w;
      for(let i=0;i<3;i++){ g.save(); g.rotate(i*Math.PI/3); g.beginPath(); g.moveTo(0,-s*.38); g.lineTo(0,s*.38);
        for(const y of [-.22,.22]){ const sy=Math.sign(y); g.moveTo(0,y*s); g.lineTo(-s*.1,(y+sy*.12)*s); g.moveTo(0,y*s); g.lineTo(s*.1,(y+sy*.12)*s); } g.stroke(); g.restore(); } } g.restore(); return; }

    for(let i=0;i<4;i++){ const x=s*.82-i*s*.16; g.quadraticCurveTo(x-s*.04,s*.76,x-s*.08,s*.86); g.quadraticCurveTo(x-s*.12,s*.76,x-s*.16,s*.86); } g.closePath(); out(grad('#ffffff','#c4b5fd'));
    g.fillStyle=INK; ell(g,s*.4,s*.44,s*.06,s*.08); g.fill(); ell(g,s*.6,s*.44,s*.06,s*.08); g.fill(); ell(g,s/2,s*.62,s*.05,s*.07); g.fill(); return; }

    g.beginPath(); for(let i=0;i<16;i++){ const a=i/16*Math.PI*2, r=i%2?s*.1:s*.2; g.lineTo(s/2+Math.cos(a)*r,s/2+Math.sin(a)*r); } g.closePath(); g.fillStyle='#fff7ae'; g.fill(); return; }
  if(k==='hole'){ ell(g,s/2,s/2,s*.42,s*.42); out(grad('#a855f7','#1e1b4b')); g.save(); g.translate(s/2,s/2);
    for(let i=0;i<3;i++){ g.rotate(Math.PI*2/3); g.beginPath(); g.arc(s*.06,0,s*.26,-.2,2.2); g.lineWidth=s*.06; g.strokeStyle='rgba(244,114,182,.9)'; g.stroke(); }

    g.fillStyle='rgba(255,255,255,.55)'; g.beginPath(); g.moveTo(s*.3,s*.24); g.lineTo(s*.48,s*.24); g.lineTo(s*.38,s*.4); g.lineTo(s*.18,s*.4); g.closePath(); g.fill();
    g.strokeStyle='rgba(28,18,51,.35)'; g.lineWidth=s*.03; g.beginPath(); g.moveTo(s*.1,s*.4); g.lineTo(s*.9,s*.4); g.moveTo(s*.38,s*.4); g.lineTo(s/2,s*.88); g.lineTo(s*.62,s*.4); g.stroke(); return; }
  if(k==='crate'){ g.beginPath(); g.roundRect(s*.1,s*.36,s*.8,s*.52,s*.08); out(grad('#a78bfa','#5b21b6')); g.beginPath(); g.roundRect(s*.06,s*.2,s*.88,s*.22,s*.08); out(grad('#c4b5fd','#7c3aed'));
    g.fillStyle='#fde047'; g.fillRect(s*.44,s*.2,s*.12,s*.68); g.strokeStyle=INK; g.lineWidth=s*.03; g.strokeRect(s*.44,s*.2,s*.12,s*.68);
    g.font='700 '+(s*.3)+'px Fredoka,sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.lineWidth=s*.07; g.strokeStyle=INK; g.strokeText('?',s*.27,s*.64); g.strokeText('?',s*.73,s*.64);

const cellsOf=()=>blobs.filter(b=>b.cell&&b.alive);
function trySplit(){ if(STATE!=='play'||POPOPEN||!P||!P.alive) return; const cs=cellsOf();
  if(cs.length>=3){ toast('Max 4 pieces at once!'); return; } if(P.m<40){ toast('Too small to split - get to 40 mass'); return; }
  const m=P.m/2; P.m=m; P.r=rad(m); P.squish=1;
  const c={id:uid++,x:P.x+P.dx*P.r*.6,y:P.y+P.dy*P.r*.6,vx:P.dx*900,vy:P.dy*900,m,r:rad(m),dr:P.dr*.7,alive:true,isP:true,cell:true,seed:rnd(0,10),lx:P.dx,ly:P.dy,blink:0,blinkT:2,mood:2,squish:1,eatT:.3,
    shield:0,dashT:.42,dashCd:9,spikeCd:.6,pw:{spd:0,mag:0,x2:0},kills:0,dx:P.dx,dy:P.dy,thr:1,name:P.name,skin:P.skin,team:P.team,hat:P.hat,mergeT:10};
  blobs.push(c); R0.splits=(R0.splits||0)+1; qAdd('split',1); SFX.dash(); burst(c.x,c.y,SKINS[P.skin].c[0],8,c.r); }
function tryShoot(){ if(STATE!=='play'||POPOPEN||!P||!P.alive) return; if(P.m<20) return; if((P.shootCd||0)>0) return;
  P.shootCd=.1; P.m-=10; P.r=rad(P.m); P.squish=.4;
  const sp=950+Math.hypot(P.vx,P.vy), f=newFood({x:P.x+P.dx*(P.r+16),y:P.y+P.dy*(P.r+16),vx:P.dx*sp,vy:P.dy*sp,m:9,c:SKINS[P.skin].c[1],chunk:true});
  f.shot=1; f.own=P; f.age=0; f.a=1; food.push(f); tone(420,.08,'triangle',.18,260); qAdd('shoot',1); }
function cellsPre(dt){ if(!P) return; P.shootCd=(P.shootCd||0)-dt;
  for(const c of cellsOf()){ c.mergeT-=dt; c.skin=P.skin; let tx,ty;
    if(c.mergeT<=0){ tx=P.x; ty=P.y; c.thr=1; } else { tx=P.x+P.dx*(P.r*2+260); ty=P.y+P.dy*(P.r*2+260); c.thr=Math.max(.3,P.thr); }
    const dx=tx-c.x, dy=ty-c.y, L=Math.hypot(dx,dy)||1; c.dx=dx/L; c.dy=dy/L; if(c.mergeT>0) c.thr*=Math.min(1,L/80); } }
function cellsPost(dt){ const cs=cellsOf(); if(!cs.length||!P||!P.alive) return;
  const all=[P,...cs];
  for(let i=0;i<all.length;i++) for(let j=i+1;j<all.length;j++){ const a=all[i], b=all[j];
    if(a===P?b.mergeT<=0:(a.mergeT<=0&&b.mergeT<=0)) continue;                    /* merging pieces may overlap */
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1, min=a.r+b.r; if(d>=min) continue;
    const push=(min-d)*.5; a.x-=dx/d*push; a.y-=dy/d*push; b.x+=dx/d*push; b.y+=dy/d*push; }
  for(const b of all){ b.x=Math.max(b.r*.5,Math.min(WORLD-b.r*.5,b.x)); b.y=Math.max(b.r*.5,Math.min(WORLD-b.r*.5,b.y)); }
  for(const c of cs){ if(c.mergeT<=0&&Math.hypot(c.x-P.x,c.y-P.y)<P.r+c.r*.4){ P.m+=c.m; c.alive=false; blobs.splice(blobs.indexOf(c),1); P.squish=1; P.eatT=.3; burst(P.x,P.y,SKINS[P.skin].c[0],10,P.r*.5); tone(300,.15,'triangle',.25,600); } }
  /* camera: keep every piece on screen */
  const left=cellsOf(); if(!left.length) return; let sx=P.x*P.m, sy=P.y*P.m, sm=P.m; for(const c of left){ sx+=c.x*c.m; sy+=c.y*c.m; sm+=c.m; }
  const cx=sx/sm, cy=sy/sm; let spread=P.r+Math.hypot(P.x-cx,P.y-cy); for(const c of left) spread=Math.max(spread,Math.hypot(c.x-cx,c.y-cy)+c.r);
  const a=Math.min(1,dt*9); CAM.x+=(cx-P.x)*a; CAM.y+=(cy-P.y)*a;
  const want=Math.min(W,H)*.42/spread; if(CAM.z>want) CAM.z+=(want-CAM.z)*Math.min(1,dt*3); }
/* feed a spike 3 shots and it flies off - it pops the big blobs it hits */
function shotSpikes(dt){
  for(let i=food.length-1;i>=0;i--){ const f=food[i]; if(!f.shot) continue; f.age+=dt; if(f.age>3){ f.shot=0; continue; }
    for(const s of spikes){ if(s.temp!==undefined||Math.hypot(f.x-s.x,f.y-s.y)>s.r+8) continue;
      const L=Math.hypot(f.vx,f.vy); if(L>5){ s.ldx=f.vx/L; s.ldy=f.vy/L; } else if(P){ s.ldx=P.dx; s.ldy=P.dy; }
      s.fed=(s.fed||0)+1; s.sh=1; food.splice(i,1);
      if(s.fed>=3){ s.fed=0; s.vx=s.ldx*1100; s.vy=s.ldy*1100; s.flying=1.8; s.own=P; s.fx=s.x; s.fy=s.y; SFX.pop(); floatTxt(s.x,s.y-s.r-20,'SPIKE SHOT!','#4ade80',true); qAdd('spikeshot',1); }
      else floatTxt(s.x,s.y-s.r-14,s.fed+'/3','#bef264');
      break; } }
  for(const s of spikes){ if(!s.flying) continue;
    if(Math.hypot(s.x-s.fx,s.y-s.fy)>200){ s.flying=0; s.own=undefined; continue; }                  /* it popped someone and jumped away */
    s.flying-=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; const k=Math.pow(.3,dt); s.vx*=k; s.vy*=k; s.rot+=dt*8;
    if(s.x<s.r||s.x>WORLD-s.r) s.vx*=-1; if(s.y<s.r||s.y>WORLD-s.r) s.vy*=-1;
    s.x=Math.max(s.r,Math.min(WORLD-s.r,s.x)); s.y=Math.max(s.r,Math.min(WORLD-s.r,s.y)); s.fx=s.x; s.fy=s.y;
    if(Math.random()<.5) parts.push({x:s.x,y:s.y,vx:-s.vx*.2,vy:-s.vy*.2,t:.35,T:.35,c:'#86efac',s:10});
    if(s.flying<=0){ s.flying=0; s.own=undefined; } } }

  for(const b of blobs.slice()){ if(!b.alive) continue; const d=Math.hypot(b.x-ZONE.x,b.y-ZONE.y); if(d<=ZONE.r) continue;
    b.m-=(b.m*.07+3)*dt; b.r=rad(Math.max(1,b.m));

function petTick(dt){ if(!PET||!P||!P.alive||STATE!=='play') return;
  const pr=Math.max(14,Math.min(80,P.dr*.32)); PET.r=pr; PET.look-=dt; PET.eat=Math.max(0,PET.eat-dt*3);
  if(PET.f&&food[PET.fi]!==PET.f) PET.f=null;
  if(PET.look<=0&&!PET.f){ PET.look=.25; const R=260+P.r*1.4; let bd=1e9;
    for(let i=0;i<food.length;i+=3){ const f=food[i]; if(f.shot||Math.abs(f.x-P.x)>R||Math.abs(f.y-P.y)>R) continue; if(Math.hypot(f.x-P.x,f.y-P.y)<P.r+12) continue;
      const d=Math.abs(f.x-PET.x)+Math.abs(f.y-PET.y); if(d<bd){ bd=d; PET.f=f; PET.fi=i; } } }
  let tx,ty; if(PET.f){ tx=PET.f.x; ty=PET.f.y; } else { const a=T*1.4; tx=P.x-P.dx*(P.r+pr*2)+Math.cos(a)*pr; ty=P.y-P.dy*(P.r+pr*2)+Math.sin(a)*pr-pr; }

  TRLACC+=dt*(S.trail==='rainbow'?60:S.trail==='zap'?22:34);
  while(TRLACC>=1){ TRLACC--; const ux=P.vx/sp, uy=P.vy/sp, j=rnd(-.55,.55)*P.dr*(S.trail==='rainbow'?.2:1), s=Math.min(P.dr*.34,70)*rnd(.7,1.15);

(function(){ const base=ac; ac=function(){ const a=base(); if(a&&MST&&!FXC){ try{

    const warm=a.createBiquadFilter(); warm.type='lowpass'; warm.frequency.value=9500;
    MST.disconnect(); MST.connect(warm); warm.connect(FXC); FXC.connect(a.destination);
    const len=Math.floor(a.sampleRate*1.3), ir=a.createBuffer(2,len,a.sampleRate);
    for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)*.6; }
    const vb=a.createConvolver(); vb.buffer=ir; const vs=a.createGain(); vs.gain.value=.14; MST.connect(vs); vs.connect(vb); vb.connect(FXC);
  }catch(_){} } return a; }; })();
const pitch=m=>440*Math.pow(2,(m-69)/12);
function voice(f,d,o){ if(!AC||!S.sfx||CG.muted) return; o=o||{}; const t0=AC.currentTime+(o.at||0), v=o.v||.2;
  const g=AC.createGain(); g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+(o.att||.006)); g.gain.exponentialRampToValueAtTime(.0008,t0+d);
  let out=g; if(o.lp){ const f2=AC.createBiquadFilter(); f2.type='lowpass'; f2.frequency.setValueAtTime(o.lp,t0); if(o.lp2) f2.frequency.exponentialRampToValueAtTime(o.lp2,t0+d); g.connect(f2); out=f2; }
  out.connect(MST);
  (o.harm||[[1,1]]).forEach(([mul,amp])=>{ const os=AC.createOscillator(), og=AC.createGain(); os.type=o.type||'sine';
    os.frequency.setValueAtTime(f*mul,t0); if(o.to) os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to*mul),t0+(o.glide||d*.8));
    og.gain.value=amp; os.connect(og); og.connect(g); os.start(t0); os.stop(t0+d+.05); }); }
function noiseHit(d,o){ if(!AC||!S.sfx||CG.muted) return; o=o||{}; const t0=AC.currentTime+(o.at||0);
  const len=Math.floor(AC.sampleRate*d), b=AC.createBuffer(1,len,AC.sampleRate), dd=b.getChannelData(0); for(let i=0;i<len;i++) dd[i]=Math.random()*2-1;
  const s=AC.createBufferSource(); s.buffer=b; const f=AC.createBiquadFilter(); f.type=o.type||'bandpass'; f.frequency.setValueAtTime(o.f||1800,t0); if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t0+d); f.Q.value=o.q||1.2;
  const g=AC.createGain(); g.gain.setValueAtTime(o.v||.15,t0); g.gain.exponentialRampToValueAtTime(.0008,t0+d); s.connect(f); f.connect(g); g.connect(MST); s.start(t0); }

/* ---------- 2) MUSIC: an upbeat band loop (kick, snare, hats, bass, chords, lead) on the music channel ---------- */
const PROG=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]];             /* Am - F - C - G */
const LEAD=[76,0,76,79,0,76,74,72, 0,72,74,76,0,74,72,69, 72,0,72,76,0,79,81,79, 76,0,74,72,0,74,76,0];
function bn(t,f,d,v,type,lp){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.008); g.gain.exponentialRampToValueAtTime(.0006,t+d);
  let out=g; if(lp){ const fl=AC.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=lp; g.connect(fl); out=fl; } o.connect(g); out.connect(MUSG); o.start(t); o.stop(t+d+.05); }
function bnz(t,d,v,f,type){ const len=Math.floor(AC.sampleRate*d), b=AC.createBuffer(1,len,AC.sampleRate), dd=b.getChannelData(0); for(let i=0;i<len;i++) dd[i]=Math.random()*2-1;
  const s=AC.createBufferSource(); s.buffer=b; const fl=AC.createBiquadFilter(); fl.type=type; fl.frequency.value=f; const g=AC.createGain();
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0006,t+d); s.connect(fl); fl.connect(g); g.connect(MUSG); s.start(t); }
musTick=function(){ if(!AC||!MUSG) return; const spb=60/120/4;                    /* 16th notes at 120 bpm */
  while(MUS.next<AC.currentTime+.25){ const t=MUS.next, st=MUS.step, s=st%16, ch=PROG[Math.floor(st/16)%4];
    if(s%4===0){ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(45,t+.13);
      g.gain.setValueAtTime(.45,t); g.gain.exponentialRampToValueAtTime(.001,t+.18); o.connect(g); g.connect(MUSG); o.start(t); o.stop(t+.2); }
    if(s===4||s===12) bnz(t,.14,.12,1900,'bandpass');
    if(s%2===0) bnz(t,.03,s%4===2?.05:.03,8500,'highpass');
    if(s%4===0||s===10) bn(t,pitch(ch[0]-24),spb*2.6,.2,'triangle',700);
    if(s===2||s===6||s===10||s===14) ch.forEach(n=>bn(t,pitch(n),spb*1.2,.03,'triangle',2600));
    const m=LEAD[st%32]; if(m&&(st>>5)%4!==0){ bn(t,pitch(m),spb*2.2,.05,'sine'); bn(t,pitch(m)*4,spb*.8,.007,'sine'); }
    MUS.next+=spb; MUS.step++; } };

const EVS=[

  const b=document.createElement('div'); b.className='bigtxt evtxt'; b.style.color=e.col; b.innerHTML='<img src="'+iconURL(e.ic,128)+'">'+L(e.nm)+'!'; document.body.appendChild(b); setTimeout(()=>b.remove(),1700);

function netTryJoin(p,id){ return new Promise(res=>{ let done=false; const fin=v=>{ if(done) return; done=true; p.off&&p.off('error',onErr); res(v); };

  let c; try{ c=p.connect(id,{reliable:true,serialization:'json'}); }catch(_){ fin({none:true}); return; }
  c.on('open',()=>c.send({t:'hi',nm:netName(),skin:S.skin,hat:S.hat,v:2}));
  c.on('data',d=>{ if(done) return; if(d&&d.t==='full'){ try{ c.close(); }catch(_){} fin({full:true}); } else if(d&&d.t==='wel') fin({c,wel:d}); });
  setTimeout(()=>{ try{ if(!done) c.close(); }catch(_){} fin({none:true}); },6000); }); }

    if(tok!==NET.tok){ try{ me.p.destroy(); r.c&&r.c.close(); }catch(_){} return; }

function netWS(room,ms){ return new Promise(res=>{ let done=false, ws; const fin=v=>{ if(!done){ done=true; res(v); } };

  const c={open:false,peer:'server',send(m){ if(ws.readyState===1) ws.send(JSON.stringify(m)); },close(){ try{ ws.close(); }catch(_){} },on(ev,fn){ (h[ev]||(h[ev]=[])).push(fn); },off(){}};
  ws.onopen=()=>{ c.open=true; ws.send(JSON.stringify({t:'room',room})); };
  ws.onmessage=e=>{ let d; try{ d=JSON.parse(e.data); }catch(_){ return; }
    if(!done){ if(d.t==='room'){ c.room=d.room; c.send({t:'hi',nm:netName(),skin:S.skin,hat:S.hat,v:2}); }
      else if(d.t==='nope') fin({err:d.why}); else if(d.t==='wel') fin({c,wel:d,p:{destroy(){ c.close(); }}}); return; }
    for(const f of h.data) f(d); };
  ws.onclose=()=>{ c.open=false; if(!done) fin({err:'closed'}); else for(const f of h.close) f(); };
  ws.onerror=()=>{ if(!done) fin({err:'error'}); };
  setTimeout(()=>{ if(!done){ try{ ws.close(); }catch(_){} fin({err:'timeout'}); } },ms||10000); }); }

/* ---------- SMOOTH ONLINE MOVEMENT ----------

const NET_INTERP=.15;
function netInterp(b,rt){ const h=b.hist; if(!h||!h.length) return; if(h.length===1||rt<=h[0][0]){ b.x=h[0][1]; b.y=h[0][2]; return; }
  for(let i=h.length-1;i>0;i--){ const a=h[i-1], c=h[i]; if(rt>=a[0]){ const span=Math.max(1e-3,c[0]-a[0]);
      if(rt<=c[0]){ const q=(rt-a[0])/span; b.x=a[1]+(c[1]-a[1])*q; b.y=a[2]+(c[2]-a[2])*q; }
      else { const q=Math.min(.2,rt-c[0])/span; b.x=c[1]+(c[1]-a[1])*q; b.y=c[2]+(c[2]-a[2])*q; } return; } } }
function netPredict(dt){ const b=P, st=b.stun||b.tstop||b.bubbled; if(b.pvx===undefined){ b.pvx=b.pvy=b.cx=b.cy=0; NET.ph=NET.ph||[]; }
  const sp=speed(b.m)*(b.dashT>0?2.7:1)*(b.rocket?1.8:b.pw.spd>0?1.35:1)*b.thr*(b.frozen?.3:1)*(b.slimed?.35:1);
  const ax=st?0:b.dx*sp, ay=st?0:b.dy*sp, k=Math.min(1,dt*(st?2:b.dashT>0?14:7)); b.pvx+=(ax-b.pvx)*k; b.pvy+=(ay-b.pvy)*k; b.dashT-=dt;
  b.x=Math.max(b.r*.5,Math.min(WORLD-b.r*.5,b.x+b.pvx*dt)); b.y=Math.max(b.r*.5,Math.min(WORLD-b.r*.5,b.y+b.pvy*dt));
  const c=Math.min(1,dt*4), cx=b.cx*c, cy=b.cy*c; if(cx||cy){ b.x+=cx; b.y+=cy; b.cx-=cx; b.cy-=cy; for(const e of NET.ph){ e[1]+=cx; e[2]+=cy; } }
  const now=performance.now(); NET.ph.push([now,b.x,b.y]); while(NET.ph.length>2&&now-NET.ph[0][0]>2500) NET.ph.shift(); }
function netReconcile(sx,sy){ const b=P; if(!b||!NET.ph||!NET.ph.length){ if(b){ b.x=sx; b.y=sy; } return; }

const AR_RULES=[
 [/^You ate (.+)!$/, m=>'أكلت '+m[1]+'!'],
 [/^(.+) ate you!$/, m=>m[1]+' أكلك!'],
 [/^(.+) ate a piece of you!$/, m=>m[1]+' أكل قطعة منك!'],
 [/^(.+) ate (.+)!$/, m=>m[1]+' أكل '+m[2]+'!'],
 [/^Unlocked (.+)!$/, m=>'فتحت '+L(m[1])+'!'],
 [/^You can unlock (.+)!$/, m=>'يمكنك فتح '+L(m[1])+'!'],
 [/^(.+) • (.+) • VS BOTS$/, m=>L(m[1])+' • '+L(m[2])+' • ضد البوتات'],
 [/^Leaves (.+) behind you when you move$/, m=>'يترك '+L(m[1])+' خلفك عندما تتحرك'],
 [/^(.+) equipped!$/, m=>'تم اختيار '+L(m[1])+'!'],
 [/^(.+) MODE • x([\d.]+) COINS$/, m=>'وضع '+L(m[1])+' • عملات x'+m[2]],
 [/^Graphics: (.+)$/, m=>'الرسومات: '+L(m[1])],
 [/^IN (.+)$/, m=>'في '+L(m[1])],
 [/^BUY (.+)$/, m=>'اشترِ '+m[1]],
 [/^([A-Z][A-Z ]+)!$/, m=>{ const t=arCore(m[1]); return t===m[1]?m[0]:t+'!'; }]
];
const AR_UP=new Map(); for(const k in AR){ const u=k.toUpperCase(); if(!(u in AR)&&!AR_UP.has(u)) AR_UP.set(u,AR[k]); }
const LC=new Map();
function arCore(c){
  c=c.replace(/\s+/g,' ');
  if(AR[c]!==undefined) return AR[c];
  const nums=[]; const t=c.replace(/\d+(\.\d+)?/g,x=>{nums.push(x);return '#';});
  const fill=s=>{let k=0; return s.replace(/#/g,()=>nums[k++]!==undefined?nums[k-1]:'#');};
  if(nums.length&&AR[t]!==undefined) return fill(AR[t]);
  const up=AR_UP.get(c.toUpperCase()); if(up!==undefined) return up;
  if(nums.length){ const up2=AR_UP.get(t.toUpperCase()); if(up2!==undefined) return fill(up2); }
  for(const [re,fn] of AR_RULES){ const m=c.match(re); if(m) return fn(m); }
  return c; }
function L(s){
  if(!S||S.lang!==1||typeof s!=='string'||!/[A-Za-z]/.test(s)) return s;
  const hit=LC.get(s); if(hit!==undefined) return hit;
  const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/); const out=m[1]+arCore(m[2])+m[3];
  if(LC.size>5000) LC.clear(); LC.set(s,out); return out; }

/* ---- DOM: remember each text node's English, show the Arabic ---- */
const TR_EN=new WeakMap(), TR_LAST=new WeakMap();
function trText(n){ const cur=n.nodeValue; if(!cur) return; let en=TR_EN.get(n);
  if(en===undefined||cur!==TR_LAST.get(n)){ en=cur; TR_EN.set(n,en); }
  const want=S.lang===1?L(en):en; TR_LAST.set(n,want); if(cur!==want) n.nodeValue=want; }
function trAll(root){ if(!root) return; if(root.nodeType===3){ trText(root); return; } if(root.nodeType!==1) return;
  if(root.tagName==='SCRIPT'||root.tagName==='STYLE'||root.classList.contains('st-logo')) return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(n.nodeType===1){ const t=n.tagName; return (t==='SCRIPT'||t==='STYLE'||n.classList.contains('st-logo'))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_SKIP; }
    return NodeFilter.FILTER_ACCEPT; }});
  let n; while((n=tw.nextNode())) trText(n); }
new MutationObserver(ms=>{ if(!S||S.lang!==1) return;
  for(const m of ms){ if(m.type==='characterData') trText(m.target); else m.addedNodes.forEach(trAll); } })
  .observe(document.body,{subtree:true,childList:true,characterData:true});

(function(){ const b1=hudText; const NMS=new Set(BOTNAMES); hudText=function(s,x,y,sz,c,al){ return b1(typeof s==='string'&&!NMS.has(s)&&!(P&&s===P.name)?L(s):s,x,y,sz,c,al); }; })();
(function(){ const b2=floatTxt; floatTxt=function(x,y,s,c,big){ return b2(x,y,typeof s==='string'?L(s):s,c,big); }; })();
(function(){ const b3=addFeed; addFeed=function(s){ return b3(L(s)); }; })();

document.head.appendChild(arCss);
function applyLang(){ const ar=S.lang===1; document.documentElement.lang=ar?'ar':'en'; document.documentElement.classList.toggle('ar',ar); LC.clear(); trAll(document.body); }

  row.innerHTML='Language<button class="btn small '+(S.lang===1?'':'blue')+'" data-a="lang" style="margin:0">'+(S.lang===1?'العربية':'ENGLISH')+'</button>';
  bindActs(row); rows[rows.length-1].after(row); if(S.lang===1) trAll(c); }; })();
ACT.lang=()=>{ S.lang=S.lang===1?0:1; save(); applyLang(); settingsCard(true); };
